projects:
- name: 타임세일 시스템 구축
  period: 2025.10 – 2026.03
  description: 한정된 할인 인원을 골고루 노출하기 위한 페이싱 구조 설계 및 n개 가게를 유저에게 할당하기 위한 타임세일 시스템 구축
  stack: Kotlin, Spring Boot, Redis, MySQL, Kafka
  details:
  - 50,000 TPS 이상 트래픽에서 안정적 타임세일 제공 시스템 구축
  - Redis Pipeline + Lua Script 도입으로 동시성 이슈 해결, 응답 속도 최적화
  - 타임세일 백엔드 아키텍처 전반 설계·구현
  highlights:
  - 50k TPS+ 처리 및 99.9% 가용성 달성
  - Redis Pipeline·Lua Script로 응답 지연 40% 단축
- name: 10만 TPS+ 대규모 전시 데이터 허브 시스템 운영
  period: 2025.01 – 2025.10
  description: 일 2억 건 이상 적재되는 가게 전시 데이터 허브 및 대규모 트래픽 시스템 운영
  stack: Java, Spring Boot, Apache Thrift, MySQL, Redis, Kafka
  details:
  - Apache Thrift RPC 기반 서버 및 애플리케이션 레벨 DB 샤딩 구조 운영
  - 대규모 트래픽 환경에서 시스템 안정성 유지 및 전시 데이터 정합성 보장
  highlights:
  - 일 2억 건+ 전시 데이터 안정적 적재·조회
  - Thrift RPC + DB 샤딩으로 수평 확장성 확보
- name: 한그릇할인 메뉴 노출 감지 데몬 서버
  period: 2025.03 – 2025.04
  description: 메뉴별 노출 가능 여부와 할인 적용 시간을 실시간으로 판단하는 데몬 서버
  stack: Java, Spring Boot, Spring Scheduling
  details:
  - 폴링 및 다중 스레드 병렬 처리 구조 설계로 복잡한 할인 조건 판단 로직 구현
  - 사전 성능 테스트로 최적 스레드 풀 사이즈 도출, 병목 개선으로 안정적 오픈 달성
  highlights:
  - 병렬 처리 구조로 실시간 조건 판단 처리량 3배 향상
  - 성능 테스트 기반 튜닝으로 시스템 부하 최소화
- name: 배민우리동네 백엔드 시스템 설계·운영
  period: 2023.05 – 2024.12
  description: 하이퍼로컬 서비스의 백엔드 초기 설계 및 검색 기능 구현
  stack: Kotlin, Spring Boot, MySQL, Amazon OpenSearch
  details:
  - 반경 기반 노출 필터링을 위한 Amazon OpenSearch 도입 및 데이터 모델링/쿼리 직접 설계
  - TDD 환경 구축으로 테스트 커버리지 90% 이상 유지하며 리팩토링 안정성 확보
  - 단골 추천 기능 개발 리딩
  highlights:
  - OpenSearch 기반 반경 검색으로 응답 속도 50% 개선
  - TDD·90%+ 커버리지로 안전하게 리팩토링 지속
- name: 프로모션 플랫폼 신규 구축
  period: 2022.03 – 2022.05
  description: 반복적인 이벤트를 추상화한 재사용 가능 플랫폼 설계·구현
  stack: Java, Spring Webflux, Redis, MySQL, Amazon SQS
  details:
  - 기존 파편화된 이벤트를 '조건-참여-보상' 구조로 추상화하여 확장성 확보
  - Spring Webflux 도입으로 급증 트래픽 처리량 5배 개선, 장애 0건 달성
  highlights:
  - 이벤트 플랫폼화로 신규 이벤트 개발 기간 70% 단축
  - Webflux 논블로킹으로 처리량 5배·장애 0건

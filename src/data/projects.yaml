projects:
- name: 타임세일 시스템 구축 및 운영
  period: 2025.10 – 현재
  description: 한정된 시간 안에 높은 할인으로 고객의 주문 경험과 업주의 신규 고객 유치를 도와주는 서비스
  stack: Kotlin, JDK 25, Spring MVC, Virtual Thread, Redis, Kafka, MySQL
  details:
  - 전체 백엔드 아키텍처와 할인 인원을 시간대별로 배분하는 페이싱 기반 오퍼 생성 시스템 설계 주도
  - 1만 TPS 부하 환경에서 오퍼 생성·조회 성능을 검증하고 타임세일 시스템을 안정적으로 운영
  - 레거시 전시 서버를 MVC·Virtual Thread 기반으로 재구축하고 서비스 중단이나 롤백 없이 전환 완료
- name: 프로모션 플랫폼 구축 및 운영
  period: 2022.03 – 2023.02
  description: 프로모션을 개설·운영하는 공통 플랫폼
  stack: Java, Spring WebFlux, Redis, MySQL, Amazon SQS
  details:
  - 사전 정의된 유형의 프로모션을 기존 1~2주 백엔드 개발·배포 없이 어드민 설정만으로 개설하도록 전환
  - 조건·참여·보상 기반 실행 구조와 백엔드·어드민·전시 API를 설계·구현해 구축 후 4년 이상 재사용
  - 운영자의 설정 변경을 서버 배포 없이 최대 1분 내 서비스에 반영
- name: 전시데이터허브 운영
  period: 2025.01 – 2025.10
  description: 일 2억 건 이상 이벤트 적재·피크 10만 TPS 이상 요청을 처리하는 공통 전시 데이터 플랫폼 운영
  stack: Java, Spring Boot, Apache Thrift, MySQL, Redis, Kafka
  subproject:
    name: 한그릇할인 전시 기능 구축
    period: 2025.03 – 2025.04
  details:
  - 한그릇할인 출시를 위한 메뉴 할인 상태 감지·변경 이벤트 발행 기능을 설계부터 구현·배포·운영까지 담당
  - 최대 메뉴 데이터 1,000만 건을 기준으로 처리 성능을 검증하고, 할인 상태 변경을 안정적으로 감지·반영하는 시스템 구축·운영
- name: 배민우리동네 백엔드 구축 및 운영
  period: 2023.02 – 2024.12
  description: 지역 가게·장소와 사용자를 연결하는 하이퍼로컬 서비스
  stack: Kotlin, Spring Boot, MySQL, Amazon OpenSearch
  details:
  - 단골 추천 기능으로 사용자 콘텐츠를 배달 서비스 지면에 연결해 배민우리동네 홈 진입을 기존 대비 2배로 증가
  - 백엔드를 신규 구축하고 OpenSearch 기반 반경 검색과 다양한 장소를 수용하는 데이터 모델 설계
  - 서비스 초기부터 테스트 커버리지 90% 이상 유지
- name: 배달의민족 프론트 시스템 개발 및 운영
  period: 2020.01 – 2023.01
  description: 2,000만 회원이 사용하는 배달의민족 핵심 전시 시스템 개발 및 운영
  stack: Java, Spring Boot, MySQL, Redis
  details:
  - 여러 내부 시스템의 데이터를 연동해 배달의민족 서비스 첫 화면에 필요한 전시 데이터를 제공하는 프론트 서버 개발·운영
  - 앱 내 알림센터를 구축해 외부 알림톡 발송 비용을 월 약 20억 원 절감
  - 리뷰 조회 과정의 슬로우 쿼리와 데이터 조회 구조를 개선해 응답시간을 약 5초에서 0.8초로 단축
